name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Bootstrap Gradle and fix executable bit
        run: |
          chmod +x gradlew
          ./gradlew --version || true
          chmod +x "$HOME/.gradle/wrapper/dists/gradle-9.7.0-bin/bootstrap/bin/gradle"
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --console=plain
      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: vmcoin-exchange-1.0.0
          path: build/libs/vmcoin-exchange-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
